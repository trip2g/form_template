name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start the stand
        run: |
          docker compose up -d trip2g
          docker compose run --rm seed

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run the tests
        run: npx playwright test

      - name: Server log
        if: failure()
        run: docker compose logs trip2g

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop the stand
        if: always()
        run: docker compose down -v
