name: form-template
services:
  trip2g:
    image: ghcr.io/trip2g/trip2g:${TRIP2G_VERSION:-0.11.0}
    ports: ["${STAND_PORT:-18081}:8081"]
    environment:
      LISTEN_ADDR: 0.0.0.0:8081
      INTERNAL_LISTEN_ADDR: ":8082"
      PUBLIC_URL: http://localhost:${STAND_PORT:-18081}
      DB_FILE: /data/data.sqlite3
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /data/storage
      OWNER_EMAIL: owner@example.com
      DEV: "true"
      USER_TOKEN_INSECURE: "true"
      JWT_SECRET: stand-secret-not-for-production
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    tmpfs: ["/data"]

  seed:
    image: node:22-alpine
    depends_on: [trip2g]
    working_dir: /work
    volumes:
      - ./form.html:/work/form.html:ro
      - ./example:/work/example:ro
      - ./stand:/work/stand:ro
    environment:
      TRIP2G_URL: http://trip2g:8081
      OWNER_EMAIL: owner@example.com
      STAND_URL: http://localhost:${STAND_PORT:-18081}
    command: ["node", "stand/seed.mjs"]
    restart: "no"
